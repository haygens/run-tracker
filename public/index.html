<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Run Tracker</h1>

    <section>
      <h2 id="form-heading">Add a run</h2>
      <form id="run-form" novalidate>
        <label>
          Date
          <input type="date" name="date" required>
        </label>
        <label>
          Distance (km)
          <input type="number" name="distance_km" min="0" step="any" placeholder="5 or 5.2" required>
        </label>
        <label>
          Elevation (m)
          <input type="number" name="elevation_m" min="0" step="1" value="0" required>
        </label>
        <label>
          Time (minutes)
          <input type="text" name="duration" placeholder="75 or 65:30" autocomplete="off" required
                 aria-describedby="duration-hint">
          <small id="duration-hint" class="hint">75 = 75 min · 65:30 = 65 min 30 s · 1:05:30 also works</small>
        </label>
        <label>
          Type
          <select name="run_type" required>
            <option value="easy">Easy</option>
            <option value="long">Long</option>
            <option value="tempo">Tempo</option>
            <option value="intervals">Intervals</option>
            <option value="race">Race</option>
            <option value="trail">Trail</option>
            <option value="hike">Hike</option>
          </select>
        </label>
        <!-- Blank caption keeps the button level with the inputs -->
        <div class="form-actions">
          <span aria-hidden="true">&nbsp;</span>
          <div class="buttons">
            <button type="submit" id="submit-button">Add run</button>
            <button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button>
          </div>
        </div>
      </form>
      <div id="form-message" role="status" hidden></div>
    </section>

    <section>
      <h2>Runs</h2>
      <table id="runs-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th class="num">Distance (km)</th>
            <th class="num">Elevation (m)</th>
            <th class="num">Time</th>
            <th class="num">Pace (min/km)</th>
            <th><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="runs-empty" hidden>No runs yet. Add your first one above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
